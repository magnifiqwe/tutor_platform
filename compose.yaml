services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${APP_DOMAIN}
      RUNTIME_ORIGIN: https://${RUNTIME_DOMAIN}
      DATA_DIR: /app/data
      PORT: 3000
      RUNNER_PORT: 3001
    volumes:
      - platform_data:/app/data
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  platform_data:
  caddy_data:
  caddy_config:
